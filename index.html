<!DOCTYPE html>
<html>
<head>
  <title>Modify Multiple CSV Files</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: #ffffff;
    }
    .overlay {
      background-color: rgba(0, 0, 0, 0.0);
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .container {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 600px;
      margin: 50px auto;
      background-color: rgba(255, 255, 255, 0.9);
      padding: 30px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      color: #333333;
    }
    h1 {
      text-align: center;
      color: #333333;
    }
    .file-input {
      margin: 20px 0;
      text-align: center;
    }
    #fileInput {
      display: none;
    }
    .custom-file-upload {
      border: 2px dashed #cccccc;
      display: inline-block;
      padding: 20px;
      cursor: pointer;
      border-radius: 8px;
      color: #666666;
      background-color: #f9f9f9;
      transition: background-color 0.3s ease;
    }
    .custom-file-upload:hover {
      background-color: #f0f0f0;
    }
    .button {
      background-color: #28a745;
      color: #ffffff;
      padding: 15px 30px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin: 20px 0;
      display: block;
      width: 100%;
      transition: background-color 0.3s ease;
    }
    .button:hover {
      background-color: #218838;
    }
    #downloadLink {
      text-decoration: none;
      color: #007bff;
      font-size: 16px;
      display: block;
      text-align: center;
      margin-top: 20px;
    }
    #downloadLink:hover {
      text-decoration: underline;
    }
    .file-names {
      margin-top: 10px;
      text-align: center;
      color: #555555;
    }
    .file-names ul {
      list-style-type: none;
      padding: 0;
    }
    .file-names li {
      margin: 5px 0;
    }
    .attribution {
      text-align: center;
      font-size: 12px;
      margin-top: 20px;
      color: #aaaaaa;
      position: relative;
      z-index: 2;
    }
    .attribution a {
      color: #aaaaaa;
      text-decoration: none;
    }
    .attribution a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="overlay"></div>
  <div class="container">
    <h1>Modify Multiple CSV Files</h1>
    <div class="file-input">
      <label for="fileInput" class="custom-file-upload">
        Click to select CSV files
      </label>
      <input type="file" id="fileInput" accept=".csv" multiple />
      <div class="file-names" id="fileNames" style="display: none;">
        <strong>Selected Files:</strong>
        <ul id="fileList"></ul>
      </div>
    </div>
    <button id="processButton" class="button">Process Files</button>
    <a id="downloadLink" style="display: none;">Download Modified CSV</a>
  </div>
  

  <script>
    // Your Unsplash API Access Key
    const UNSPLASH_ACCESS_KEY = 'v7PaeqIlbJKzwBp67VUMQ91HKHyxBPwDDOLcCVl5KVM';

    // Function to fetch a random image from Unsplash
    function fetchRandomBackground() {
      fetch('https://api.unsplash.com/photos/random?query=landscape,nature&orientation=landscape', {
        headers: {
          'Authorization': 'Client-ID ' + UNSPLASH_ACCESS_KEY
        }
      })
      .then(response => response.json())
      .then(data => {
        if (data && data.urls && data.urls.full) {
          const imageUrl = data.urls.full + '&w=' + window.innerWidth + '&q=80&fm=jpg&crop=entropy';
          document.body.style.backgroundImage = 'url("' + imageUrl + '")';
        } else {
          console.error('Failed to load background image.');
        }
      })
      .catch(error => {
        console.error('Error fetching background image:', error);
      });
    }

    // Call the function to fetch and set the background image
    fetchRandomBackground();

    const fileInput = document.getElementById('fileInput');
    const processButton = document.getElementById('processButton');
    const downloadLink = document.getElementById('downloadLink');
    const fileNamesDiv = document.getElementById('fileNames');
    const fileList = document.getElementById('fileList');

    // Display selected file names
    fileInput.addEventListener('change', function() {
      if (fileInput.files.length > 0) {
        fileNamesDiv.style.display = 'block';
        fileList.innerHTML = '';
        Array.from(fileInput.files).forEach(file => {
          const listItem = document.createElement('li');
          listItem.textContent = file.name;
          fileList.appendChild(listItem);
        });
      } else {
        fileNamesDiv.style.display = 'none';
        fileList.innerHTML = '';
      }
    });

    processButton.addEventListener('click', function() {
      if (fileInput.files.length === 0) {
        alert('Please select at least one CSV file.');
        return;
      }
      const files = fileInput.files;
      let mergedData = [];

      const readFiles = Array.from(files).map(file => {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = function(e) {
            const csvData = e.target.result;
            const rows = csvData.split('\n').filter(row => row.trim() !== '');
            // Ignore the first row (header)
            for (let i = 1; i < rows.length; i++) {
              let value = rows[i].trim();
              if (value.startsWith('0')) {
                value = value.substring(1);
              }
              value = '971' + value;
              mergedData.push(value);
            }
            resolve();
          };
          reader.onerror = reject;
          reader.readAsText(file);
        });
      });

      Promise.all(readFiles).then(() => {
        const newCsvData = mergedData.join('\n');
        const blob = new Blob([newCsvData], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        downloadLink.href = url;
        downloadLink.download = 'modified.csv';
        downloadLink.style.display = 'block';
        downloadLink.textContent = 'Download Modified CSV';
      }).catch(error => {
        console.error('Error reading files:', error);
      });
    });
  </script>
</body>
</html>
