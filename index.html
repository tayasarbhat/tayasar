<!DOCTYPE html>
<html>
<head>
  <title>Merge CSV Files</title>
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <style>
    /* General Styles */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      width: 100%;
      height: 100vh;
      color: #ffffff;
      background-position: center;
      background-repeat: no-repeat;
      color: #ffffff;
    }
    .overlay {
      background-color: rgba(0, 0, 0, 0.0);
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
   .container {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 90%;
  max-width: 800px;
  background-color: rgba(255, 255, 255, 0.2);
  padding: 30px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
  border-radius: 50px;
  color: #333333;
	}
    h1 {
      text-align: center;
      color: #333333;
    }
    /* File Input Styles */
    .file-input {
      margin: 20px 0;
      text-align: center;
    }
    #fileInput {
      display: none;
    }
    .custom-file-upload {
      border: 2px dashed #cccccc;
      display: inline-block;
      padding: 20px;
      cursor: pointer;
      border-radius: 20px;
      color: #666666;
      background-color: rgba(255, 255, 255, 0.5);;
      transition: background-color 0.3s ease;
    }
    .custom-file-upload:hover {
      background-color: #f0f0f0;
    }
    /* Button Styles */
    .button {
  background-color: rgba(000, 255, 000, 0.5);
  color: #ffffff;
  padding: 15px 30px;
  border: none;
  border-radius: 20px;
  cursor: pointer;
  font-size: 16px;
  margin: 20px auto; /* Centering the button */
  display: block;
  width: 30%; /* Set width to 50% */
  transition: background-color 0.3s ease;
}
    .button:hover {
      background-color: #218838;
    }
    /* Statistics Section Styles */
    .stats-section {
      margin-top: 30px;
      background-color: #f9f9f9;
      padding: 20px;
      border-radius: 8px;
      color: #333333;
    }
    .stats-section h2 {
      text-align: center;
      margin-top: 0;
    }
    .stats-list {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }
    .stats-list li {
      margin: 10px 0;
      font-size: 16px;
    }
    /* Download Links Styles */
    .download-section {
      margin-top: 30px;
    }
    .download-section h2 {
      text-align: center;
      color: #333333;
    }
    .download-item {
      background-color: #f0f0f0;
      margin: 10px 0;
      padding: 15px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .download-item a {
      text-decoration: none;
      color: #007bff;
      font-size: 16px;
    }
    .download-item a:hover {
      text-decoration: underline;
    }
    /* File Names Styles */
    .file-names {
      margin-top: 10px;
      text-align: center;
      color: #555555;
    }
    .file-names p {
      margin: 0;
      padding: 0;
    }
    /* Attribution Styles */
    .attribution {
      text-align: center;
      font-size: 12px;
      margin-top: 20px;
      color: #aaaaaa;
      position: relative;
      z-index: 2;
    }
    .attribution a {
      color: #aaaaaa;
      text-decoration: none;
    }
    .attribution a:hover {
      text-decoration: underline;
    }  
      .footer {
      text-align: center;
      font-size: 20px;
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      background-color: rgba(0, 0, 0, 0.2);
      padding: 10px;
      color: #ffffff;
      z-index: 3;
    }
    
  </style>
</head>
<body>
  <div class="overlay"></div>
  <div class="container">
    <h1>Merge CSV Files</h1>
    <div class="file-input">
      <label for="fileInput" class="custom-file-upload">
        Click to select CSV files
      </label>
      <input type="file" id="fileInput" accept=".csv" multiple />
      <div class="file-names" id="fileNames" style="display: none;">
        <strong>Selected Files:</strong>
        <p id="fileList"></p>
      </div>
    </div>
    <button id="processButton" class="button">Process Files</button>
    <!-- Statistics Section -->
    <div class="stats-section" id="statsSection" style="display: none;">
      <h2>Processing Summary</h2>
      <ul class="stats-list">
        <li>Total Files Merged: <span id="totalFiles"></span></li>
        <li>Total Records Found: <span id="totalRecords"></span></li>
        <li>Duplicates Removed: <span id="duplicatesRemoved"></span></li>
      </ul>
    </div>
    <div class="download-section" id="downloadSection" style="display: none;">
      <h2>Generated Files</h2>
      <div id="downloadList"></div>
    </div>
  </div>
  
  <script>
    // Your Unsplash API Access Key
    const UNSPLASH_ACCESS_KEY = 'v7PaeqIlbJKzwBp67VUMQ91HKHyxBPwDDOLcCVl5KVM';

    // Function to fetch a random image from Unsplash
    function fetchRandomBackground() {
      fetch('https://api.unsplash.com/photos/random?query=landscape,nature&orientation=landscape', {
        headers: {
          'Authorization': 'Client-ID ' + UNSPLASH_ACCESS_KEY
        }
      })
      .then(response => response.json())
      .then(data => {
        if (data && data.urls && data.urls.full) {
          const imageUrl = data.urls.full + '&w=' + window.innerWidth + '&q=80&fm=jpg&crop=entropy';
          document.body.style.backgroundImage = 'url("' + imageUrl + '")';
        } else {
          console.error('Failed to load background image.');
        }
      })
      .catch(error => {
        console.error('Error fetching background image:', error);
      });
    }

    // Call the function to fetch and set the background image
    fetchRandomBackground();

    const fileInput = document.getElementById('fileInput');
    const processButton = document.getElementById('processButton');
    const fileNamesDiv = document.getElementById('fileNames');
    const fileList = document.getElementById('fileList');
    const statsSection = document.getElementById('statsSection');
    const totalFilesElement = document.getElementById('totalFiles');
    const totalRecordsElement = document.getElementById('totalRecords');
    const duplicatesRemovedElement = document.getElementById('duplicatesRemoved');
    const downloadSection = document.getElementById('downloadSection');
    const downloadList = document.getElementById('downloadList');

    // Display selected file names separated by commas
    fileInput.addEventListener('change', function() {
      if (fileInput.files.length > 0) {
        fileNamesDiv.style.display = 'block';
        const fileNamesArray = Array.from(fileInput.files).map(file => file.name);
        fileList.textContent = fileNamesArray.join(', ');
      } else {
        fileNamesDiv.style.display = 'none';
        fileList.textContent = '';
      }
    });

    processButton.addEventListener('click', function() {
      if (fileInput.files.length === 0) {
        alert('Please select at least one CSV file.');
        return;
      }
      const files = fileInput.files;
      let mergedData = new Set();
      let totalRecords = 0;

      const readFiles = Array.from(files).map(file => {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = function(e) {
            const csvData = e.target.result;
            const rows = csvData.split('\n').filter(row => row.trim() !== '');
            // Ignore the first row (header)
            totalRecords += (rows.length - 1); // Exclude header
            for (let i = 1; i < rows.length; i++) {
              let value = rows[i].trim();
              if (value.startsWith('0')) {
                value = value.substring(1);
              }
              value = '971' + value;
              mergedData.add(value);
            }
            resolve();
          };
          reader.onerror = reject;
          reader.readAsText(file);
        });
      });

      Promise.all(readFiles).then(() => {
        // Convert Set to Array and remove duplicates
        const uniqueData = Array.from(mergedData);
        const duplicatesRemoved = totalRecords - uniqueData.length;

        // Display statistics
        statsSection.style.display = 'block';
        totalFilesElement.textContent = files.length;
        totalRecordsElement.textContent = totalRecords;
        duplicatesRemovedElement.textContent = duplicatesRemoved;

        // Split data into chunks of 9000
        const chunkSize = 9000;
        const chunks = [];
        for (let i = 0; i < uniqueData.length; i += chunkSize) {
          chunks.push(uniqueData.slice(i, i + chunkSize));
        }
        
         // Get today's date in DDMMYY format
    const today = new Date();
    const day = String(today.getDate()).padStart(2, '0');
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const year = String(today.getFullYear()).slice(-2);
    const dateStr = `${day}${month}${year}`;

        // Clear previous download links
        downloadList.innerHTML = '';
        downloadSection.style.display = 'block';

        chunks.forEach((chunk, index) => {
          const newCsvData = chunk.join('\n');
          const blob = new Blob([newCsvData], { type: 'text/csv' });
          const url = URL.createObjectURL(blob);

          // Create download link
          const downloadItem = document.createElement('div');
          downloadItem.classList.add('download-item');

          const fileInfo = document.createElement('div');
          fileInfo.innerHTML = `
            <strong>File ${index + 1}</strong><br>
            Records: ${chunk.length}<br>
            Size: ${(blob.size / 1024).toFixed(2)} KB
          `;

          const downloadLink = document.createElement('a');
          downloadLink.href = url;
          downloadLink.download = `Numbers_${dateStr}_part_${index + 1}.csv`;
          downloadLink.textContent = 'Download';

          downloadItem.appendChild(fileInfo);
          downloadItem.appendChild(downloadLink);
          downloadList.appendChild(downloadItem);
        });
      }).catch(error => {
        console.error('Error reading files:', error);
      });
    });
  </script>
  <div class="footer">
    <p>Made with <i class="fas fa-heart" style="color: #ff6b6b;"></i> by TAB. <a href="#"></a></p>
  </div>
</body>
</html>
